[config.site]
title = "Ilham Agustiawan"
description = "Software engineer and indie hacker wannabe from Indonesia. Personal writing, sometimes technical."
pageTitle = "Ilham Agustiawan"
pageDescription = "Software engineer and indie hacker wannabe from Indonesia. Personal writing, sometimes technical."
url = "https://ilhamagustiawan.github.io"
repository = "https://github.com/ilhamagustiawan/blog"
footerNote = "Built on astro-navfolio."

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft, ink
palette = "ink"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "en"

[config.fonts]
# 英文与代码感 UI 字体
en = "Commit Mono"
code = "Commit Mono"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "min-light"
darkTheme = "min-dark"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing"
kicker = "Archive"
subtitle = "All posts, newest first."
note = ""
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Small tools and site systems."
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "Ilham Agustiawan"
handle = "@ilhamagustiawan"
role = "Software engineer, indie hacker wannabe"
email = "hello@example.com" # TODO: replace with your public email
website = "https://ilhamagustiawan.github.io"
github = "https://github.com/ilhamagustiawan"
avatar = "/images/avatar.webp"

[[config.topNav.links]]
label = "blog"
href = "/blog"

[[config.topNav.links]]
label = "about"
href = "/about"

[config.home]

[config.home.quote]
text = ["Personal, sometimes technical, and other stuff."]

[config.home.intro]
title = "Ilham Agustiawan"
name = "Ilham Agustiawan"
body = ["Hi, I'm Ilham, a software engineer and indie hacker wannabe from Indonesia. I write about personal things, sometimes technical, and other stuff."]

[config.home.latest]
count = 1
heatmapWeeks = 24
showHeatmapLatest = true
excludeDraft = true
startDate = ""
dateArchiveBaseHref = ""

# Unused by the current home page; kept to satisfy the config schema.
[[config.home.navigation]]
icon = "pen"
title = "Blog"
subtitle = "Writing"
href = "/blog"

# Plain links render as "Find me on ..." on the home page. Empty tooltip hides one.
[[config.home.links]]
label = "GitHub"
icon = "github"
tooltip = "https://github.com/ilhamagustiawan"
copy = false

[[config.home.links]]
label = "Instagram"
icon = "instagram"
tooltip = "https://www.instagram.com/_ilhamagustiawan/"
copy = false

[[config.home.links]]
label = "RSS"
icon = "rss"
tooltip = "/rss.xml"
copy = false

[[config.home.doing]]
text = "Writing"
mark = "01"
